name: pages

# Builds the wheel and publishes the browser demo to
# https://egnaro9.github.io/agent-graph/ — the page installs real LangGraph
# plus this wheel into Pyodide and runs the actual graph client-side.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Assemble the demo site
        run: |
          mkdir -p site
          cp demo/index.html demo/app.js site/
          cp dist/*.whl site/
          WHEEL=$(cd dist && ls *.whl | head -1)
          echo "window.WHEEL_URL = './${WHEEL}';" > site/wheel.js
          # The composition demo installs llm-gateway's own published wheel from
          # its Pages build: its CI's artifact, not a copy. Two things this line
          # used to get wrong, both of which killed the demo at boot.
          #
          # Host. It pointed at egnaro9.github.io, which 301s to erikhill.dev and
          # serves that redirect WITHOUT Access-Control-Allow-Origin, so the
          # cross-origin fetch died on the hop. It is not same-origin, whatever the
          # old comment said. erikhill.dev answers 200 with ACAO *, and is one hop
          # shorter.
          #
          # Version. It hardcoded 0.1.0. llm-gateway publishes a wheel.js naming the
          # exact wheel its CI just built, so read that instead of guessing; a pinned
          # filename goes stale the moment that project releases.
          GW=$(curl -fsS https://erikhill.dev/llm-gateway/wheel.js \
               | sed -n "s/.*window.WHEEL_URL *= *'\.\/\([^']*\)'.*/\1/p")
          test -n "$GW"   # fail loudly rather than deploy a demo that cannot boot
          echo "window.GATEWAY_WHEEL_URL = 'https://erikhill.dev/llm-gateway/${GW}';" >> site/wheel.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
