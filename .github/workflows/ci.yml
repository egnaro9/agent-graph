name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"
      - name: Run tests
        run: pytest -q
      - name: README's advertised test count must match the suite
        run: python scripts/check_readme_test_count.py
      - name: Smoke — run the agent on a multi-step query
        # pipefail, because the default shell is `bash -e {0}` with no pipefail: the
        # pipeline's status would be tee's, so a CLI exiting non-zero left this step GREEN.
        shell: bash -eo pipefail {0}
        run: |
          python -m agentgraph.cli run "What is 15% of 240 and who wrote Hamlet?" | tee run.out
          grep -q "36" run.out
          grep -q "Shakespeare" run.out
