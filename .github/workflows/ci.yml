name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"
      - name: Run tests
        run: pytest -q
      # Was scripts/check_readme_test_count.py here until 2026-10-10. Four other
      # repositories held byte-identical copies, so it is a package now. Pinned to a
      # commit, not main: a gate that tracks someone else's default branch is a gate
      # that person can change, and it being me makes that worse rather than better.
      - name: README's advertised test count must match the suite
        run: |
          set -o pipefail
          pip install "git+https://github.com/egnaro9/readme-test-count@6752d7ec7e6177aceff6359905b1d68ab90b546a"
          readme-test-count
      - name: Smoke — run the agent on a multi-step query
        # pipefail, because the default shell is `bash -e {0}` with no pipefail: the
        # pipeline's status would be tee's, so a CLI exiting non-zero left this step GREEN.
        shell: bash -eo pipefail {0}
        run: |
          python -m agentgraph.cli run "What is 15% of 240 and who wrote Hamlet?" | tee run.out
          grep -q "36" run.out
          grep -q "Shakespeare" run.out
